<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Hover</title>
    <link rel="stylesheet" href="cardhover.css">
</head>
<body>
    <div class="card">
        <img src="man.jpg" alt="man" />
        <div class="desc">
            <h3>Harshith Reddy</h3>
            <p>Sofware Engineer</p>
        </div>
    </div>

    <div class="card">
        <img src="woman.jpg" alt="woman" />
        <div class="desc">
            <h3>Sahasra</h3>
            <p>Neurologist</p>
        </div>
    </div>
        
</body>
</html>
